<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKEWERBROS — Email Documentation</title>
  <style>
    :root {
      --brand: #B31E23;
      --brand-dark: #770D0F;
      --bg: #FAECDF;
      --sidebar-w: 320px;
      --border: #e5e7eb;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: #1f2937; display: flex; min-height: 100vh; }

    .sidebar {
      width: var(--sidebar-w); background: #fff; border-right: 1px solid var(--border);
      position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 10;
    }
    .sidebar-header {
      background: #fff; color: #1f2937; padding: 20px; border-bottom: 1px solid var(--border);
    }
    .sidebar-header img { display: block; width: 180px; height: auto; }
    .sidebar-header p { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .sidebar-header .doc-switch {
      display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700;
      color: #fff; text-decoration: none; background: var(--brand);
      padding: 5px 10px; border-radius: 6px; letter-spacing: .02em;
    }
    .sidebar-header .doc-switch:hover { background: var(--brand-dark); }
    .search { padding: 12px; border-bottom: 1px solid var(--border); }
    .search input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    }
    .group-label {
      padding: 12px 16px 4px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
    }
    .nav-item {
      display: block; padding: 10px 16px; font-size: 13px; color: #374151; text-decoration: none;
      border-left: 3px solid transparent; cursor: pointer;
    }
    .nav-item:hover { background: #f9fafb; }
    .nav-item.active { background: #fef2f2; border-left-color: var(--brand); color: var(--brand); font-weight: 600; }
    .nav-item .badge {
      display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; font-weight: 600;
    }
    .badge-customer { background: #dbeafe; color: #1e40af; }
    .badge-admin { background: #fef3c7; color: #92400e; }
    .badge-scheduled { background: #ede9fe; color: #5b21b6; }

    .main { margin-left: var(--sidebar-w); flex: 1; padding: 32px; max-width: 960px; }
    .meta-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px;
    }
    .meta-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .meta-card label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
    .meta-card span { font-size: 14px; }
    h2 { font-size: 24px; margin-bottom: 8px; }
    .subject-line { color: var(--muted); font-size: 15px; margin-bottom: 24px; font-style: italic; }

    .preview-wrap {
      background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px;
    }
    .preview-toolbar {
      background: #f9fafb; padding: 10px 16px; border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--muted); display: flex; justify-content: space-between;
    }
    .preview-frame { width: 100%; border: none; min-height: 600px; background: var(--bg); }

    .flow-section { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .flow-section h3 { margin-bottom: 12px; }
    .sample-data { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; font-size: 13px; line-height: 1.7; color: var(--muted); }
    .sample-data strong { color: #374151; }

    @media (max-width: 768px) {
      .sidebar { position: static; width: 100%; max-height: 40vh; }
      .main { margin-left: 0; padding: 16px; }
      body { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <img src="skewerbros-wordmark.png" width="180" alt="SKEWERBROS">
    <p>Email Documentation · <span id="email-count"></span> emails</p>
    <a class="doc-switch" href="./index.html">← QA DOCS</a>
  </div>
  <div class="search"><input type="text" id="search" placeholder="Search emails…"></div>
  <div id="nav-list"></div>
</nav>

<main class="main" id="main">
  <div id="email-detail">
    <p style="color: var(--muted); padding-top: 40px;">Select an email from the sidebar to preview its content.</p>
  </div>
</main>

<script>
const SANS = "'HK Requisite', Helvetica, Arial, sans-serif";
const SERIF = "'Hedvig Letters Serif', Georgia, 'Times New Roman', serif";
const PAGE = '#FAECDF';
const INK = '#1A1A1A';
const BODY_COLOR = '#3C3C3C';
const MUTED = '#6B6560';
const LINE = 'rgba(26,26,26,0.12)';
const BRAND = '#B31E23';
const WORDMARK = 'skewerbros-wordmark.png';
const BRAND_FOOTER = `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:28px auto 0;max-width:600px;"><tr><td style="padding:8px 8px 0;font-family:${SERIF};font-size:22px;line-height:1.3;color:${INK};">Better protein starts with real food.</td></tr><tr><td style="padding:14px 8px 0;font-family:${SANS};font-size:14px;"><a href="#" style="color:${INK};text-decoration:underline;">Help centre</a>&nbsp;&nbsp;&nbsp;<a href="#" style="color:${INK};text-decoration:underline;">Reply to this email</a>&nbsp;&nbsp;&nbsp;<a href="#" style="color:${INK};text-decoration:underline;">Account</a></td></tr><tr><td style="padding:16px 8px 0;font-family:${SANS};font-size:13px;line-height:1.5;color:${MUTED};">SkewerBros · GTA &amp; surrounding areas<br>You're getting this because you have an active subscription.</td></tr></table>`;
const SIMPLE_FOOTER = BRAND_FOOTER;
const MANAGE_BTN = `<a href="#" style="display:inline-block;background:${BRAND};color:#fff;padding:14px 28px;border-radius:999px;text-decoration:none;font-weight:600;font-family:${SANS};">Manage Subscription →</a>`;

function eyebrow(label) {
  return `<p style="margin:0 0 14px;font-family:${SANS};font-size:14px;font-weight:600;color:${BRAND};">● ${label}</p>`;
}
function headline(text) {
  return `<h1 style="margin:0 0 16px;font-family:${SERIF};font-size:32px;line-height:1.2;font-weight:400;color:${INK};">${text}</h1>`;
}
function splitRows(rows) {
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:4px 0 8px;">${rows.map((row) => {
    const weight = row.emphasize ? '700' : '400';
    const valueColor = row.value === 'None' || row.value === 'No Fiber' || row.value === 'No Carbs' ? MUTED : INK;
    return `<tr><td style="padding:14px 12px 14px 0;border-bottom:1px solid ${LINE};font-family:${SANS};font-size:16px;font-weight:${weight};color:${INK};">${row.label}</td><td align="right" style="padding:14px 0;border-bottom:1px solid ${LINE};font-family:${SANS};font-size:16px;font-weight:${weight};color:${valueColor};">${row.value}</td></tr>`;
  }).join('')}</table>`;
}
function flavorRows(source) {
  const lines = String(source).split(/<br\s*\/?>|,\s*/i).map((line) => line.replace(/&bull;\s*/g, '').trim()).filter(Boolean);
  return splitRows(lines.map((line) => {
    const qtyFirst = line.match(/^(\d+)\s+x\s+(.+)$/i);
    if (qtyFirst) return { label: qtyFirst[2], value: `× ${qtyFirst[1]}`, emphasize: true };
    const nameFirst = line.match(/^(.+?)\s+x\s*(\d+)$/i);
    if (nameFirst) return { label: nameFirst[1].replace(/,$/, ''), value: `× ${nameFirst[2]}`, emphasize: true };
    return { label: line, value: '', emphasize: true };
  }));
}
function sectionLabel(text) {
  return `<p style="margin:20px 0 0;font-family:${SANS};font-size:14px;color:${MUTED};">${text}</p>`;
}
function alertBox(html) {
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background:#FFF3CC;border:1px solid #F8D868;border-radius:12px;"><tr><td style="padding:18px 20px;font-family:${SANS};font-size:15px;line-height:1.5;color:${INK};">${html}</td></tr></table>`;
}

const S = {
  firstName: 'Alex',
  fullName: 'Alex Smith',
  email: 'alex@example.com',
  phone: '416-555-0100',
  company: 'Acme Corp',
  address: '123 King St W',
  unit: 'Unit 501',
  postal: 'M5H 1A1',
  fullAddress: '123 King St W, Unit 501, M5H 1A1',
  newFullAddress: '456 Queen St E, Unit 302, M5A 1T1',
  buzzer: '501',
  instructions: 'Leave at concierge desk. Text when you arrive.',
  deliveryDate: 'Monday, March 10, 2026',
  deliveryDateShort: 'Monday, March 10',
  deliveryDateTime: 'Monday, March 10 · 5:30–10:30 PM',
  deliveryTime: '5:30 PM – 10:30 PM',
  meals: 10,
  chickenBreasts: '10 x 9oz chicken breasts',
  proteinLine: '10 meals · 700g+ protein',
  chickenLine: '1 x 9oz chicken breast',
  flavorsHtml: '4 x Lemon Herb<br>3 x Shawarma<br>3 x Buffalo',
  flavorsBullets: '&bull; 4 x Lemon Herb<br>&bull; 3 x Shawarma<br>&bull; 3 x Buffalo',
  flavorsInline: '4 x Lemon Herb, 3 x Shawarma, 3 x Buffalo',
  flavorsAdmin: 'Lemon Herb x4, Shawarma x3, Buffalo x3',
  dips: '2 x Garlic, 1 x Tahini',
  side: 'Garlic Rice',
  fiber: 'No Fiber',
  pitaCustomer: 'Add 1 pack pita (6 pieces, whole wheat)',
  pitaLabel: '1 pack (6 pieces, whole wheat)',
  pitaAdmin: '1 pack whole wheat (6 pieces)',
  stripeSub: 'sub_1ABC123xyz',
  invoice: 'in_1ABC123xyz',
  totalHst: '$144.64',
  totalPreTax: '$128.00',
  mealsPrice: '$95.00',
  pitaPrice: '$5.00',
  dipsPrice: '$8.00',
  sidePrice: '$20.00',
  fiberPrice: '$0.00',
  deliveryFee: '$15.00',
  totalPreTaxWithDelivery: '$143.00',
  totalHstWithDelivery: '$161.59',
  billingPeriod: 'March 5, 2026 - March 12, 2026',
  nextBilling: 'Wednesday, March 12, 2026 at 11:59 PM',
  flavorCutoff: 'Thursday, March 13, 2026 at 11:59 PM',
  mealOrderCutoff: 'Sunday 3:00 PM ET',
  recordedAt: 'March 5, 2026, 10:00 AM',
};

function customerOrderBlock(planLabel) {
  return `
      ${sectionLabel('YOUR ORDER')}
      ${splitRows([
        { label: 'Plan', value: planLabel },
        { label: 'Meals', value: S.proteinLine },
        { label: 'Chicken', value: S.chickenLine },
      ])}
      ${sectionLabel('Flavors')}
      ${flavorRows(S.flavorsHtml)}
      ${splitRows([
        { label: 'Pita', value: S.pitaLabel },
        { label: 'Dips', value: S.dips },
        { label: 'Side', value: S.side },
        { label: 'Fiber', value: S.fiber },
      ])}`;
}

function customerDeliveryBlock() {
  return `
      ${sectionLabel('Delivery')}
      ${splitRows([
        { label: 'Date & time', value: S.deliveryDateTime },
        { label: 'Address', value: `${S.address}, ${S.unit}, ${S.postal}` },
        { label: 'Buzzer', value: S.buzzer },
        { label: 'Instructions', value: S.instructions },
      ])}`;
}

function adminPricingRows(includeDelivery) {
  const deliveryRow = includeDelivery
    ? `<tr><td style="padding:8px 0;color:#6b7280;">Delivery</td><td style="padding:8px 0;font-weight:600;">${S.deliveryFee}</td></tr>`
    : '';
  return `
                <tr><td style="padding:8px 0;color:#6b7280;">Meals</td><td style="padding:8px 0;font-weight:600;">${S.mealsPrice}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Pita</td><td style="padding:8px 0;font-weight:600;">${S.pitaPrice}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Dips</td><td style="padding:8px 0;font-weight:600;">${S.dipsPrice}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Side</td><td style="padding:8px 0;font-weight:600;">${S.sidePrice}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Fiber</td><td style="padding:8px 0;font-weight:600;">${S.fiberPrice}</td></tr>${deliveryRow}
                <tr><td style="padding:8px 0;color:#6b7280;">Total (pre-tax)</td><td style="padding:8px 0;font-weight:600;">${includeDelivery ? S.totalPreTaxWithDelivery : S.totalPreTax}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Total (with HST)</td><td style="padding:8px 0;font-weight:600;">${includeDelivery ? S.totalHstWithDelivery : S.totalHst}</td></tr>
                <tr><td colspan="2" style="padding:8px 0 0;font-size:12px;color:#9ca3af;font-style:italic;">Pre-tax subtotals. HST (13%) added at billing. Empty Side/Fiber show as $0.00.</td></tr>`;
}

function adminOrderTable(includeDelivery) {
  return `
              <h3 style="color:#374151;">Order Details</h3>
              <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:120px;">Meals</td><td style="padding:8px 0;font-weight:600;">${S.meals} meals (${S.chickenBreasts})</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;vertical-align:top;">Flavor</td><td style="padding:8px 0;font-weight:600;">${S.flavorsAdmin}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Dips</td><td style="padding:8px 0;font-weight:600;">${S.dips}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Side</td><td style="padding:8px 0;font-weight:600;">${S.side}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Fiber</td><td style="padding:8px 0;font-weight:600;">${S.fiber}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Pita add-on</td><td style="padding:8px 0;font-weight:600;">${S.pitaAdmin}</td></tr>
                ${adminPricingRows(includeDelivery)}
              </table>`;
}

function adminDeliveryTable() {
  return `
              <h3 style="color:#374151;">Delivery Details</h3>
              <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:120px;">Address</td><td style="padding:8px 0;font-weight:600;">${S.fullAddress}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Date</td><td style="padding:8px 0;">${S.deliveryDate}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Time</td><td style="padding:8px 0;">${S.deliveryTime}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Buzzer Code</td><td style="padding:8px 0;font-weight:600;">${S.buzzer}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;vertical-align:top;">Instructions</td><td style="padding:8px 0;color:#92400e;background:#fef3c7;padding:8px;border-radius:4px;">${S.instructions}</td></tr>
              </table>`;
}

function adminCustomerTable(includePhone) {
  const phoneRow = includePhone
    ? `<tr><td style="padding:8px 0;color:#6b7280;">Phone</td><td style="padding:8px 0;"><a href="tel:${S.phone}" style="color:#B31E23;">${S.phone}</a></td></tr>`
    : '';
  return `
              <h3 style="color:#374151;margin-top:0;">Customer Details</h3>
              <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:140px;">Name</td><td style="padding:8px 0;font-weight:600;">${S.fullName}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Email</td><td style="padding:8px 0;"><a href="mailto:${S.email}" style="color:#B31E23;">${S.email}</a></td></tr>${phoneRow}
              </table>`;
}

function adminShell(_headerColor, title, alertHtml, bodyHtml, footerText) {
  const note = footerText ? `<p style="margin:16px 0 0;font-family:${SANS};font-size:14px;color:${MUTED};">${footerText}</p>` : '';
  return shell(`${alertHtml || ''}${bodyHtml}<div style="margin-top:20px;">${MANAGE_BTN.replace('Manage Subscription →', 'View in Admin Panel')}</div>${note}`, { headline: title });
}

function planUpdatedBody(appliesTo, meals, flavorsInline, pita, dips, nextCharge, side, fiber) {
  return `
      <p style="margin:0 0 16px;">Your meal plan has been successfully updated.</p>
      <p style="margin:0 0 16px;"><strong>Applies to:</strong><br>${appliesTo}</p>
      ${sectionLabel('Your box')}
      ${flavorRows(flavorsInline)}
      ${splitRows([
        { label: 'Meals', value: meals },
        { label: 'Pita', value: pita },
        { label: 'Dips', value: dips },
        { label: 'Side', value: side ?? S.side },
        { label: 'Fiber', value: fiber ?? S.fiber },
        { label: 'Next Charge', value: nextCharge },
      ])}
      <div style="margin-top:16px;">${MANAGE_BTN}</div>`;
}

function preBillingOrderSummary() {
  return `
      ${sectionLabel('Your box')}
      ${flavorRows(S.flavorsBullets)}
      ${splitRows([
        { label: 'Meals', value: '10 meals' },
        { label: 'Pita', value: '1 pack' },
        { label: 'Additional Dips', value: S.dips },
        { label: 'Side', value: S.side },
        { label: 'Fiber', value: S.fiber },
        { label: 'Next Charge', value: `${S.nextBilling} — ${S.totalHst}` },
      ])}`;
}

function totalRow(label, value) {
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:8px 0 20px;"><tr><td style="padding:16px 0 0;font-family:${SANS};font-size:16px;color:${INK};">${label}</td><td align="right" style="padding:16px 0 0;font-family:${SERIF};font-size:28px;line-height:1;color:${INK};">${value}</td></tr></table>`;
}
function shell(body, opts) {
  const eye = opts && opts.eyebrow ? eyebrow(opts.eyebrow) : '';
  const title = opts && opts.headline ? headline(opts.headline) : '';
  const slot = eye || title ? '' : '<!--CHROME-->';
  return `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0;padding:0;background:${PAGE};font-family:${SANS};"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:${PAGE};"><tr><td align="center" style="padding:48px 16px;"><table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:16px;"><tr><td align="center" style="padding:32px 24px 28px;border-bottom:1px solid ${LINE};"><img src="${WORDMARK}" width="220" alt="SKEWERBROS" style="display:block;margin:0 auto;border:0;width:220px;height:auto;"></td></tr><tr><td style="padding:32px 40px 36px;font-family:${SANS};color:${BODY_COLOR};font-size:16px;line-height:1.55;">${eye}${title}${slot}${body}</td></tr></table>${BRAND_FOOTER}</td></tr></table></body></html>`;
}
function adminCancelledBody(isImmediate, lastActiveDate) {
  const type = isImmediate ? 'Immediate Cancellation' : 'End of Period';
  const lastActive = isImmediate ? 'Already cancelled' : lastActiveDate;
  const headerColor = isImmediate ? '#ef4444' : '#f59e0b';
  return `${adminCustomerTable(false)}
              <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:140px;">Plan</td><td style="padding:8px 0;">${S.meals} Meals/Week</td></tr>
              </table>
              <h3 style="color:#374151;">Cancellation Details</h3>
              <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:140px;">Type</td><td style="padding:8px 0;color:${headerColor};font-weight:700;">${type}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Last Active Date</td><td style="padding:8px 0;font-weight:600;">${lastActive}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Subscription ID</td><td style="padding:8px 0;color:#6b7280;font-size:12px;">${S.stripeSub}</td></tr>
              </table>`;
}

function adminPaymentFailedBody() {
  return `<table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:140px;">Customer</td><td style="padding:8px 0;font-weight:600;">${S.fullName}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Email</td><td style="padding:8px 0;"><a href="mailto:${S.email}" style="color:#B31E23;">${S.email}</a></td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Meals/week</td><td style="padding:8px 0;">${S.meals}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Failure reason</td><td style="padding:8px 0;">Your card was declined.</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Invoice</td><td style="padding:8px 0;color:#6b7280;font-size:12px;">${S.invoice}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Stripe Sub</td><td style="padding:8px 0;color:#6b7280;font-size:12px;">${S.stripeSub}</td></tr>
              </table>`;
}

function adminRenewalBody() {
  return `${adminCustomerTable(false)}
              <h3 style="color:#374151;">Billing Details</h3>
              <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                <tr><td style="padding:8px 0;color:#6b7280;width:140px;">Plan</td><td style="padding:8px 0;font-weight:600;">${S.meals} Meals/Week — ${S.flavorsAdmin}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Pita</td><td style="padding:8px 0;font-weight:600;">${S.pitaAdmin}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Dips</td><td style="padding:8px 0;font-weight:600;">${S.dips}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Side</td><td style="padding:8px 0;font-weight:600;">${S.side}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Fiber</td><td style="padding:8px 0;font-weight:600;">${S.fiber}</td></tr>
                ${adminPricingRows(false)}
                <tr><td style="padding:8px 0;color:#6b7280;">Billing Period</td><td style="padding:8px 0;">${S.billingPeriod}</td></tr>
                <tr><td style="padding:8px 0;color:#6b7280;">Next Renewal</td><td style="padding:8px 0;">${S.nextBilling}</td></tr>

EMAILS.forEach((email) => {
  if (email.html.indexOf('<!--CHROME-->') === -1) return;
  const chrome = CHROME[email.id];
  const eye = chrome && chrome.eyebrow ? eyebrow(chrome.eyebrow) : '';
  const title = chrome && chrome.headline ? headline(chrome.headline) : '';
  email.html = email.html.replace('<!--CHROME-->', eye + title);
});

const navList = document.getElementById('nav-list');
const detail = document.getElementById('email-detail');
let currentId = null;
const groups = {};

EMAILS.forEach((e) => {
  if (!groups[e.group]) groups[e.group] = [];
  groups[e.group].push(e);
});

function badgeClass(audience) {
  if (audience === 'admin') return 'badge-admin';
  if (audience === 'customer') return 'badge-customer';
  return '';
}

function renderNav(filter = '') {
  navList.innerHTML = '';
  const q = filter.toLowerCase();
  Object.keys(groups).forEach((group) => {
    const items = groups[group].filter(
      (e) =>
        !q ||
        e.name.toLowerCase().includes(q) ||
        e.subject.toLowerCase().includes(q) ||
        e.trigger.toLowerCase().includes(q),
    );
    if (!items.length) return;
    const label = document.createElement('div');
    label.className = 'group-label';
    label.textContent = group;
    navList.appendChild(label);
    items.forEach((e) => {
      const a = document.createElement('a');
      a.className = 'nav-item' + (e.id === currentId ? ' active' : '');
      a.dataset.id = e.id;
      const badge =
        e.timing === 'scheduled'
          ? '<span class="badge badge-scheduled">scheduled</span>'
          : `<span class="badge ${badgeClass(e.audience)}">${e.audience}</span>`;
      a.innerHTML = e.name + badge;
      a.addEventListener('click', () => showEmail(e.id));
      navList.appendChild(a);
    });
  });
}

function showEmail(id) {
  currentId = id;
  const e = EMAILS.find((x) => x.id === id);
  if (!e) return;
  location.hash = id;
  renderNav(document.getElementById('search').value);

  detail.innerHTML = `
    <h2>${e.name}</h2>
    <p class="subject-line">Subject: "${e.subject}"</p>
    ${e.note ? `<div class="flow-section"><h3>Note</h3><p>${e.note}</p></div>` : ''}
    <div class="meta-grid">
      <div class="meta-card"><label>Audience</label><span>${e.audience === 'admin' ? 'Admin (support@skewerbros.com)' : 'Customer'}</span></div>
      <div class="meta-card"><label>Timing</label><span>${e.timing === 'scheduled' ? 'Scheduled via Resend' : 'Immediate'}</span></div>
      <div class="meta-card"><label>Trigger</label><span>${e.trigger}</span></div>
      <div class="meta-card"><label>Source</label><span style="font-size:12px;font-family:monospace;">${e.source}</span></div>
    </div>
    <div class="preview-wrap">
      <div class="preview-toolbar"><span>Email Preview (sample data)</span><span>Scroll inside ↓</span></div>
      <iframe class="preview-frame" srcdoc="${e.html.replace(/"/g, '&quot;')}" onload="this.style.height=this.contentDocument.documentElement.scrollHeight+'px'"></iframe>
    </div>
  `;
}

document.getElementById('search').addEventListener('input', (ev) => renderNav(ev.target.value));
document.getElementById('email-count').textContent = EMAILS.length;
renderNav();
if (location.hash) showEmail(location.hash.slice(1));
else showEmail(EMAILS[0].id);
</script>
</body>
